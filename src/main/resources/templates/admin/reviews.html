<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews — E-Canteen</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#FFB703; --red:#E63946; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { height:100%; }
        body { font-family:'Plus Jakarta Sans',sans-serif; color:#e8e2d5; min-height:100vh; display:flex; flex-direction:column;
            background-color:#141414;
            background-image:radial-gradient(rgba(255,183,3,0.05) 1.2px, transparent 1.2px); background-size:24px 24px; }
        .fd { font-family:'Barlow Condensed',sans-serif; }
        a { text-decoration:none; }
        .v-nav { background:rgba(17,17,17,0.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,183,3,0.12); position:sticky; top:0; z-index:50; }
        .v-nav-inner { max-width:820px; margin:0 auto; padding:0 28px; height:62px; display:flex; align-items:center; justify-content:space-between; }
        .logo { display:flex; align-items:center; gap:10px; }
        .logo-icon { width:32px; height:32px; background:#FFB703; border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .btn-ghost { padding:8px 16px; border:1px solid rgba(255,255,255,0.14); color:#bbb; border-radius:10px; font-size:13px; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
        .btn-ghost:hover { border-color:#FFB703; color:#FFB703; }
        .wrap { max-width:820px; margin:0 auto; padding:40px 28px 60px; flex:1 0 auto; width:100%; }
        .review-card { background:#1c1c1c; border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:18px 20px; margin-bottom:12px; }
        footer { background:#111; border-top:1px solid rgba(255,183,3,0.1); padding:22px 28px; }
        .foot-inner { max-width:820px; margin:0 auto; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<nav class="v-nav">
    <div class="v-nav-inner">
        <a th:href="@{/admin}" class="logo">
            <div class="logo-icon"><span class="fd" style="color:#111; font-size:13px; font-weight:900;">EC</span></div>
            <span class="fd" style="color:white; font-size:21px; font-weight:900; letter-spacing:2px; text-transform:uppercase;">E-Canteen <span style="color:#FFB703;">Vendor</span></span>
        </a>
        <a th:href="@{/admin}" class="btn-ghost">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            Dashboard
        </a>
    </div>
</nav>

<div class="wrap">
    <span class="fd" style="color:#FFB703; font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase;">Feedback</span>
    <h1 class="fd" style="font-size:clamp(28px,4vw,40px); font-weight:900; text-transform:uppercase; color:white; line-height:1; margin:2px 0 24px;">Customer Reviews</h1>

    <!-- empty -->
    <div th:if="${reviews.isEmpty()}" style="background:#1c1c1c; border:2px dashed rgba(255,255,255,0.12); border-radius:18px; padding:60px 24px; text-align:center;">
        <div style="width:64px; height:64px; background:rgba(255,183,3,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;">
            <svg width="28" height="28" fill="none" stroke="#FFB703" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </div>
        <p style="color:#888; font-size:14px;">No customer reviews yet.</p>
    </div>

    <!-- list -->
    <div class="review-card" th:each="r : ${reviews}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px;">
            <p class="fd" style="font-size:19px; font-weight:900; color:white; text-transform:uppercase;" th:text="${r.itemName}">Item</p>
            <span style="display:inline-flex; align-items:center; gap:4px; background:rgba(255,183,3,0.14); color:#FFB703; font-size:13px; font-weight:700; padding:5px 12px; border-radius:999px; white-space:nowrap;">
                <svg width="13" height="13" fill="#FFB703" stroke="none" viewBox="0 0 24 24"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                <span th:text="${r.rating}">5</span>/5
            </span>
        </div>
        <p style="color:#777; font-size:12px; margin-bottom:10px;">by <span style="color:#aaa;" th:text="${r.username}">user</span> — <span th:text="${r.createdAt}">time</span></p>
        <p style="color:#ccc; font-size:14px; line-height:1.6;" th:text="${r.comment}">comment</p>
    </div>
</div>

<footer>
    <div class="foot-inner">
        <p style="color:#555; font-size:12px;">&copy; 2026 E-Canteen — Vendor Portal</p>
    </div>
</footer>
</body>
</html>
