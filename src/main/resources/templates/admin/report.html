<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report — E-Canteen</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#FFB703; --red:#E63946; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { height:100%; }
        body { font-family:'Plus Jakarta Sans',sans-serif; color:#e8e2d5; min-height:100vh; display:flex; flex-direction:column;
            background-color:#141414;
            background-image:radial-gradient(rgba(255,183,3,0.05) 1.2px, transparent 1.2px); background-size:24px 24px; }
        .fd { font-family:'Barlow Condensed',sans-serif; }
        a { text-decoration:none; }
        .v-nav { background:rgba(17,17,17,0.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,183,3,0.12); position:sticky; top:0; z-index:50; }
        .v-nav-inner { max-width:900px; margin:0 auto; padding:0 28px; height:62px; display:flex; align-items:center; justify-content:space-between; }
        .logo { display:flex; align-items:center; gap:10px; }
        .logo-icon { width:32px; height:32px; background:#FFB703; border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .btn-ghost { padding:8px 16px; border:1px solid rgba(255,255,255,0.14); color:#bbb; border-radius:10px; font-size:13px; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
        .btn-ghost:hover { border-color:#FFB703; color:#FFB703; }
        .wrap { max-width:680px; margin:0 auto; padding:40px 28px 60px; flex:1 0 auto; width:100%; }
        .stat { background:#1c1c1c; border:1px solid rgba(255,255,255,0.07); border-radius:18px; padding:24px; }
        footer { background:#111; border-top:1px solid rgba(255,183,3,0.1); padding:22px 28px; }
        .foot-inner { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<nav class="v-nav">
    <div class="v-nav-inner">
        <a th:href="@{/admin}" class="logo">
            <div class="logo-icon"><span class="fd" style="color:#111; font-size:13px; font-weight:900;">EC</span></div>
            <span class="fd" style="color:white; font-size:21px; font-weight:900; letter-spacing:2px; text-transform:uppercase;">E-Canteen <span style="color:#FFB703;">Vendor</span></span>
        </a>
        <a th:href="@{/admin}" class="btn-ghost">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            Dashboard
        </a>
    </div>
</nav>

<div class="wrap">
    <span class="fd" style="color:#FFB703; font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase;">Report</span>
    <h1 class="fd" style="font-size:clamp(30px,4vw,42px); font-weight:900; text-transform:uppercase; color:white; line-height:1; margin:2px 0 8px;">Sales Report</h1>
    <p style="color:#888; font-size:14px; margin-bottom:24px;" th:text="${sales != null ? sales.stallName : '-'}">Stall</p>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="stat">
            <div style="width:46px; height:46px; border-radius:12px; background:rgba(255,183,3,0.15); display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
                <svg width="23" height="23" fill="none" stroke="#FFB703" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            </div>
            <div class="fd" style="font-size:44px; font-weight:900; color:white; line-height:1;" th:text="${sales != null ? sales.orderCount : 0}">0</div>
            <p style="color:#888; font-size:13px; margin-top:4px;">Total orders</p>
        </div>
        <div class="stat" style="background:linear-gradient(135deg,#1f1a0a,#181206); border-color:rgba(255,183,3,0.2);">
            <div style="width:46px; height:46px; border-radius:12px; background:rgba(255,183,3,0.15); display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
                <svg width="23" height="23" fill="none" stroke="#FFB703" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <div class="fd" style="font-size:36px; font-weight:900; color:#FFB703; line-height:1;">¥<span th:text="${sales != null ? sales.revenue : 0}">0</span></div>
            <p style="color:#9a8f6f; font-size:13px; margin-top:4px;">Total sales (gross)</p>
        </div>
    </div>
</div>

<footer>
    <div class="foot-inner">
        <p style="color:#555; font-size:12px;">&copy; 2026 E-Canteen — Vendor Portal</p>
    </div>
</footer>
</body>
</html>
