<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Stall Discount — E-Canteen</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#FFB703; --red:#E63946; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { height:100%; }
        body { font-family:'Plus Jakarta Sans',sans-serif; color:#e8e2d5; min-height:100vh; display:flex; flex-direction:column;
            background-color:#141414;
            background-image:radial-gradient(rgba(255,183,3,0.05) 1.2px, transparent 1.2px); background-size:24px 24px; }
        .fd { font-family:'Barlow Condensed',sans-serif; }
        a { text-decoration:none; }
        .v-nav { background:rgba(17,17,17,0.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,183,3,0.12); position:sticky; top:0; z-index:50; }
        .v-nav-inner { max-width:900px; margin:0 auto; padding:0 28px; height:62px; display:flex; align-items:center; justify-content:space-between; }
        .logo { display:flex; align-items:center; gap:10px; }
        .logo-icon { width:32px; height:32px; background:#FFB703; border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .btn-ghost { padding:8px 16px; border:1px solid rgba(255,255,255,0.14); color:#bbb; border-radius:10px; font-size:13px; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
        .btn-ghost:hover { border-color:#FFB703; color:#FFB703; }
        .wrap { max-width:520px; margin:0 auto; padding:40px 28px 60px; flex:1 0 auto; width:100%; }
        .panel-gold { background:linear-gradient(135deg,#1f1a0a,#181206); border:1px solid rgba(255,183,3,0.2); border-radius:20px; padding:28px; }
        .input { width:100%; background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.1); border-radius:12px; padding:13px 15px; color:white; font-size:15px; font-family:inherit; outline:none; transition:border-color .2s, box-shadow .2s; }
        .input:focus { border-color:#FFB703; box-shadow:0 0 0 3px rgba(255,183,3,0.12); }
        .btn-gold { width:100%; background:#FFB703; color:#111; font-family:'Barlow Condensed',sans-serif; font-weight:900; text-transform:uppercase; letter-spacing:1px; border:none; border-radius:999px; padding:14px; font-size:20px; cursor:pointer; transition:background .2s, box-shadow .2s; }
        .btn-gold:hover { background:#e6a500; box-shadow:0 8px 24px rgba(255,183,3,0.3); }
        footer { background:#111; border-top:1px solid rgba(255,183,3,0.1); padding:22px 28px; }
        .foot-inner { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<nav class="v-nav">
    <div class="v-nav-inner">
        <a th:href="@{/admin}" class="logo">
            <div class="logo-icon"><span class="fd" style="color:#111; font-size:13px; font-weight:900;">EC</span></div>
            <span class="fd" style="color:white; font-size:21px; font-weight:900; letter-spacing:2px; text-transform:uppercase;">E-Canteen <span style="color:#FFB703;">Vendor</span></span>
        </a>
        <a th:href="@{/admin}" class="btn-ghost">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            Dashboard
        </a>
    </div>
</nav>

<div class="wrap">
    <span class="fd" style="color:#FFB703; font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase;">Stall Promo</span>
    <h1 class="fd" style="font-size:clamp(30px,4vw,42px); font-weight:900; text-transform:uppercase; color:white; line-height:1; margin:2px 0 24px;">Set Stall Discount</h1>

    <div class="panel-gold" th:if="${stall != null}">
        <div style="display:flex; align-items:center; gap:14px; margin-bottom:22px;">
            <div style="width:52px; height:52px; border-radius:14px; background:rgba(255,183,3,0.15); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                <svg width="26" height="26" fill="none" stroke="#FFB703" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><path stroke-linecap="round" d="M7 7h.01"/></svg>
            </div>
            <div>
                <p class="fd" style="font-size:24px; font-weight:900; color:white; text-transform:uppercase;" th:text="${stall.name}">Stall</p>
                <p style="color:#9a8f6f; font-size:13px;">Currently active discount: <strong style="color:#FFB703;" th:text="${stall.discountPercent}">0</strong>%</p>
            </div>
        </div>

        <form method="post" th:action="@{/admin/discount/update}">
            <label style="display:block; font-size:13px; font-weight:600; color:#aaa; margin-bottom:8px;">New discount (%)</label>
            <input name="discountPercent" type="number" step="0.01" min="0" max="100" class="input" th:value="${stall.discountPercent}" required>
            <p style="color:#777; font-size:12px; margin:8px 0 20px;">This discount applies automatically to every item in your stall.</p>
            <button class="btn-gold">Save Discount</button>
        </form>
    </div>
</div>

<footer>
    <div class="foot-inner">
        <p style="color:#555; font-size:12px;">&copy; 2026 E-Canteen — Vendor Portal</p>
    </div>
</footer>
</body>
</html>
