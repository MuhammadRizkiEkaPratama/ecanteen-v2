<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Detail — E-Canteen</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#FFB703; --red:#E63946; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { height:100%; }
        body { font-family:'Plus Jakarta Sans',sans-serif; color:#e8e2d5; min-height:100vh; display:flex; flex-direction:column;
            background-color:#141414;
            background-image:radial-gradient(rgba(255,183,3,0.05) 1.2px, transparent 1.2px); background-size:24px 24px; }
        .fd { font-family:'Barlow Condensed',sans-serif; }
        a { text-decoration:none; }
        .v-nav { background:rgba(17,17,17,0.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,183,3,0.12); position:sticky; top:0; z-index:50; }
        .v-nav-inner { max-width:780px; margin:0 auto; padding:0 28px; height:62px; display:flex; align-items:center; justify-content:space-between; }
        .logo { display:flex; align-items:center; gap:10px; }
        .logo-icon { width:32px; height:32px; background:#FFB703; border-radius:8px; display:flex; align-items:center; justify-content:center; }
        .btn-ghost { padding:8px 16px; border:1px solid rgba(255,255,255,0.14); color:#bbb; border-radius:10px; font-size:13px; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:6px; }
        .btn-ghost:hover { border-color:#FFB703; color:#FFB703; }
        .wrap { max-width:780px; margin:0 auto; padding:36px 28px 60px; flex:1 0 auto; width:100%; }
        .panel { background:#1c1c1c; border:1px solid rgba(255,255,255,0.07); border-radius:18px; }
        .badge { font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; text-transform:uppercase; letter-spacing:0.5px; }
        .b-PENDING { background:rgba(255,183,3,0.15); color:#FFB703; }
        .b-PROCESSING { background:rgba(59,130,246,0.15); color:#93c5fd; }
        .b-READY { background:rgba(45,198,83,0.15); color:#8ee6a8; }
        .b-PICKED_UP { background:rgba(150,150,150,0.18); color:#bbb; }
        .b-CANCELLED { background:rgba(230,57,70,0.15); color:#fca5a5; }
        .log-row { display:flex; justify-content:space-between; align-items:center; padding:11px 16px; border-bottom:1px solid rgba(255,255,255,0.06); }
        .log-row:last-child { border-bottom:none; }
        .item-row { display:grid; grid-template-columns:2fr 1fr 0.7fr 1fr; gap:10px; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,0.06); font-size:14px; align-items:center; }
        .item-row:last-child { border-bottom:none; }
        .btn-gold { background:#FFB703; color:#111; font-family:'Barlow Condensed',sans-serif; font-weight:900; text-transform:uppercase; letter-spacing:1px; border:none; border-radius:999px; padding:13px 28px; font-size:18px; cursor:pointer; transition:background .2s, box-shadow .2s; }
        .btn-gold:hover { background:#e6a500; box-shadow:0 8px 24px rgba(255,183,3,0.3); }
        footer { background:#111; border-top:1px solid rgba(255,183,3,0.1); padding:22px 28px; }
        .foot-inner { max-width:780px; margin:0 auto; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<nav class="v-nav">
    <div class="v-nav-inner">
        <a th:href="@{/admin}" class="logo">
            <div class="logo-icon"><span class="fd" style="color:#111; font-size:13px; font-weight:900;">EC</span></div>
            <span class="fd" style="color:white; font-size:21px; font-weight:900; letter-spacing:2px; text-transform:uppercase;">E-Canteen <span style="color:#FFB703;">Vendor</span></span>
        </a>
        <a th:href="@{/admin/orders}" class="btn-ghost">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            Manage Orders
        </a>
    </div>
</nav>

<div class="wrap">
    <span class="fd" style="color:#FFB703; font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase;">Transaction Detail</span>
    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:2px 0 24px;">
        <h1 class="fd" style="font-size:clamp(30px,4vw,44px); font-weight:900; text-transform:uppercase; color:white; line-height:1;">Order #<span th:text="${order.id}">0</span></h1>
        <span class="badge" th:classappend="'b-' + ${order.status}" th:text="${order.status}">PENDING</span>
        <span style="color:#888; font-size:13px;">Payment: <span style="color:#ccc;" th:text="${order.paymentMethod}">-</span></span>
    </div>

    <!-- Status history -->
    <h2 class="fd" style="font-size:18px; font-weight:900; text-transform:uppercase; color:#FFB703; margin-bottom:12px;">Status History</h2>
    <div class="panel" style="margin-bottom:28px;">
        <div class="log-row" th:each="log : ${logs}">
            <span style="color:#ddd; font-weight:600; font-size:14px;" th:text="${log.status}">PENDING</span>
            <span style="color:#777; font-size:13px;" th:text="${log.changedAt}">time</span>
        </div>
    </div>

    <!-- Items -->
    <h2 class="fd" style="font-size:18px; font-weight:900; text-transform:uppercase; color:#FFB703; margin-bottom:12px;">Order Items</h2>
    <div class="panel">
        <div class="item-row" style="color:#777; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px;">
            <span>Item</span><span>Price</span><span>Qty</span><span style="text-align:right;">Subtotal</span>
        </div>
        <div class="item-row" th:each="item : ${items}">
            <span style="color:#ddd; font-weight:600;" th:text="${item.itemName}">Item</span>
            <span style="color:#999;">¥<span th:text="${item.unitPrice}">0</span></span>
            <span style="color:#999;" th:text="${item.quantity}">1</span>
            <span class="fd" style="font-size:16px; font-weight:900; color:white; text-align:right;">¥<span th:text="${item.lineTotal}">0</span></span>
        </div>
        <div style="padding:16px; border-top:1px solid rgba(255,255,255,0.08); background:rgba(255,183,3,0.03);">
            <div style="display:flex; justify-content:space-between; font-size:13px; color:#999; margin-bottom:5px;"><span>Subtotal</span><span>¥<span th:text="${order.subtotal}">0</span></span></div>
            <div style="display:flex; justify-content:space-between; font-size:13px; color:#8ee6a8; margin-bottom:10px;"><span>Discount</span><span>− ¥<span th:text="${order.discountTotal}">0</span></span></div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1.5px dashed rgba(255,255,255,0.12);">
                <span class="fd" style="font-size:20px; font-weight:900; text-transform:uppercase; color:white;">Total</span>
                <span class="fd" style="font-size:28px; font-weight:900; color:#FFB703;">¥<span th:text="${order.totalAmount}">0</span></span>
            </div>
        </div>
    </div>

    <form method="post" th:action="@{/admin/orders/advance}" th:if="${order.status != 'PICKED_UP'}" style="margin-top:24px;">
        <input type="hidden" name="id" th:value="${order.id}">
        <button class="btn-gold">Advance Status →</button>
    </form>
</div>

<footer>
    <div class="foot-inner">
        <p style="color:#555; font-size:12px;">&copy; 2026 E-Canteen — Vendor Portal</p>
    </div>
</footer>
</body>
</html>
