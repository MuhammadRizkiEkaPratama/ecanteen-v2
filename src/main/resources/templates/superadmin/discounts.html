<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discounts — E-Canteen</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#FFB703; --red:#E63946; --green:#2DC653; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { height:100%; }
        body { font-family:'Plus Jakarta Sans',sans-serif; color:#e8e2d5; min-height:100vh; display:flex; flex-direction:column;
            background-color:#121212;
            background-image:radial-gradient(rgba(255,183,3,0.05) 1.2px, transparent 1.2px); background-size:24px 24px; }
        .fd { font-family:'Barlow Condensed',sans-serif; }
        a { text-decoration:none; }
        body::before { content:''; position:fixed; top:-200px; right:-160px; width:520px; height:520px; background:radial-gradient(circle,rgba(255,183,3,0.07),transparent 65%); pointer-events:none; z-index:0; animation:drift1 24s ease-in-out infinite; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-110px,80px) scale(1.15)} }
        .v-nav { background:rgba(15,15,15,0.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,183,3,0.12); position:sticky; top:0; z-index:50; }
        .v-nav-inner { max-width:1000px; margin:0 auto; padding:0 30px; height:64px; display:flex; align-items:center; justify-content:space-between; }
        .logo { display:flex; align-items:center; gap:11px; }
        .logo-icon { width:34px; height:34px; background:#FFB703; border-radius:9px; display:flex; align-items:center; justify-content:center; }
        .btn-ghost { padding:9px 18px; border:1px solid rgba(255,255,255,0.14); color:#bbb; border-radius:11px; font-size:13px; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:7px; }
        .btn-ghost:hover { border-color:#FFB703; color:#FFB703; }
        .wrap { max-width:1000px; margin:0 auto; padding:38px 30px 64px; flex:1 0 auto; width:100%; position:relative; z-index:1; }
        .sec-label { color:#FFB703; font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase; display:block; margin-bottom:3px; }
        .alert { border-radius:14px; padding:14px 18px; font-size:13.5px; margin-bottom:18px; }
        .alert-success { background:rgba(45,198,83,0.1); border:1px solid rgba(45,198,83,0.3); color:#8ee6a8; }
        .alert-danger  { background:rgba(230,57,70,0.1);  border:1px solid rgba(230,57,70,0.3);  color:#fca5a5; }
        .panel { background:#1b1b1b; border:1px solid rgba(255,255,255,0.07); border-radius:20px; overflow:hidden; margin-bottom:28px; }
        .panel-head { padding:18px 22px; border-bottom:1px solid rgba(255,255,255,0.07); display:flex; align-items:center; gap:10px; }

        .tbl { width:100%; border-collapse:collapse; }
        .tbl th { text-align:left; color:#777; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:12px 20px; border-bottom:1px solid rgba(255,255,255,0.07); }
        .tbl td { padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.05); vertical-align:middle; }
        .tbl tr:last-child td { border-bottom:none; }

        .badge-on  { background:rgba(45,198,83,0.15);   color:#8ee6a8; font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; text-transform:uppercase; }
        .badge-off { background:rgba(150,150,150,0.15); color:#777;    font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; text-transform:uppercase; }

        .num-input { background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.1); border-radius:9px; padding:8px 11px; color:white; font-size:13px; font-family:inherit; outline:none; width:90px; transition:border-color .2s; }
        .num-input:focus { border-color:#FFB703; }
        .btn-save   { background:#FFB703; color:#111; font-weight:700; padding:8px 16px; border-radius:9px; border:none; font-size:12.5px; cursor:pointer; transition:background .2s; }
        .btn-save:hover { background:#e6a500; }
        .btn-toggle { font-size:12px; font-weight:700; padding:8px 14px; border-radius:9px; cursor:pointer; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.04); color:#ccc; transition:all .18s; }
        .btn-toggle:hover { border-color:#888; color:white; }

        footer { background:#0f0f0f; border-top:1px solid rgba(255,183,3,0.1); padding:24px 30px; position:relative; z-index:1; }
        .foot-inner { max-width:1000px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    </style>
</head>
<body>

<nav class="v-nav">
    <div class="v-nav-inner">
        <a th:href="@{/superadmin}" class="logo">
            <div class="logo-icon"><span class="fd" style="color:#111; font-size:14px; font-weight:900;">EC</span></div>
            <span class="fd" style="color:white; font-size:22px; font-weight:900; letter-spacing:2px; text-transform:uppercase;">E-Canteen <span style="color:#FFB703;">Admin</span></span>
        </a>
        <a th:href="@{/superadmin}" class="btn-ghost">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            Dashboard
        </a>
    </div>
</nav>

<div class="wrap">
    <span class="sec-label">Pricing</span>
    <h1 class="fd" style="font-size:clamp(30px,4vw,46px); font-weight:900; text-transform:uppercase; color:white; line-height:1; margin-bottom:24px;">
        Discount <span style="color:#FFB703;">Settings</span>
    </h1>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>

    <!-- Global discounts -->
    <div class="panel">
        <div class="panel-head">
            <svg width="18" height="18" fill="none" stroke="#FFB703" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1" fill="#FFB703"/></svg>
            <h2 class="fd" style="font-size:20px; font-weight:900; text-transform:uppercase; color:white;">Global Discounts</h2>
        </div>
        <table class="tbl">
            <thead>
            <tr><th>Name</th><th>Percent (%)</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="d : ${discounts}">
                <td style="color:white; font-weight:600;" th:text="${d.name}">Promo</td>
                <td>
                    <form method="post" th:action="@{/superadmin/discounts/update}" style="display:flex; gap:8px; align-items:center;">
                        <input type="hidden" name="id" th:value="${d.id}">
                        <input name="discountPercent" type="number" step="0.01" min="0" max="100"
                               th:value="${d.discountPercent}" class="num-input">
                        <button class="btn-save">Save</button>
                    </form>
                </td>
                <td>
                    <span th:if="${d.isActive}"  class="badge-on">Active</span>
                    <span th:if="${!d.isActive}" class="badge-off">Inactive</span>
                </td>
                <td>
                    <form method="post" th:action="@{/superadmin/discounts/toggle}">
                        <input type="hidden" name="id" th:value="${d.id}">
                        <input type="hidden" name="isActive" th:value="${d.isActive ? false : true}">
                        <button class="btn-toggle" th:text="${d.isActive ? 'Deactivate' : 'Activate'}">Toggle</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Per-stall discounts -->
    <div class="panel">
        <div class="panel-head">
            <svg width="18" height="18" fill="none" stroke="#FFB703" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M5 21V7l7-4 7 4v14"/></svg>
            <h2 class="fd" style="font-size:20px; font-weight:900; text-transform:uppercase; color:white;">Per-Stall Discounts</h2>
        </div>
        <table class="tbl">
            <thead>
            <tr><th>Stall</th><th>Discount (%)</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${stalls}">
                <td style="color:white; font-weight:600;" th:text="${s.name}">Stall</td>
                <td>
                    <form method="post" th:action="@{/superadmin/stalls/discount}" style="display:flex; gap:8px; align-items:center;">
                        <input type="hidden" name="id" th:value="${s.id}">
                        <input name="discountPercent" type="number" step="0.01" th:value="${s.discountPercent}" class="num-input">
                        <button class="btn-save">Save</button>
                    </form>
                </td>
                <td></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer>
    <div class="foot-inner">
        <div style="display:flex; align-items:center; gap:9px;">
            <div style="width:26px; height:26px; background:#FFB703; border-radius:7px; display:flex; align-items:center; justify-content:center;"><span class="fd" style="color:#111; font-size:11px; font-weight:900;">EC</span></div>
            <span class="fd" style="color:white; font-size:17px; font-weight:900; letter-spacing:2px; text-transform:uppercase;">E-Canteen</span>
        </div>
        <p style="color:#555; font-size:12px;">&copy; 2026 E-Canteen — Campus Digital Canteen System</p>
    </div>
</footer>
</body>
</html>
