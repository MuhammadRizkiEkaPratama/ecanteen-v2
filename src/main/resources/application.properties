spring.application.name=Ecanteenv2

server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/ecanteen?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.canteen.entity
mybatis.configuration.map-underscore-to-camel-case=true
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# LDAP - optional central user directory (lab only).
# Kosong = LDAP tidak dipakai, semua login memakai BCrypt seperti biasa.
# Hanya user yang barisnya bertanda use_ldap = 1 yang diperiksa lewat LDAP.
ecanteen.ldap.url=
ecanteen.ldap.user-pattern=uid=%s,ou=people,dc=example,dc=com
