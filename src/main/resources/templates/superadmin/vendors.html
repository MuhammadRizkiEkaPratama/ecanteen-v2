<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Approvals — E-Canteen</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold:#FFB703; --red:#E63946; --green:#2DC653; --blue:#4CC9F0; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { height:100%; }
        body { font-family:'Plus Jakarta Sans',sans-serif; color:#e8e2d5; min-height:100vh; display:flex; flex-direction:column;
            background-color:#121212;
            background-image:radial-gradient(rgba(255,183,3,0.05) 1.2px, transparent 1.2px); background-size:24px 24px; }
        .fd { font-family:'Barlow Condensed',sans-serif; }
        a { text-decoration:none; }
        body::before { content:''; position:fixed; top:-200px; right:-160px; width:520px; height:520px; background:radial-gradient(circle,rgba(255,183,3,0.07),transparent 65%); pointer-events:none; z-index:0; animation:drift1 24s ease-in-out infinite; }
        @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-110px,80px) scale(1.15)} }
        .v-nav { background:rgba(15,15,15,0.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,183,3,0.12); position:sticky; top:0; z-index:50; }
        .v-nav-inner { max-width:1140px; margin:0 auto; padding:0 30px; height:64px; display:flex; align-items:center; justify-content:space-between; }
        .logo { display:flex; align-items:center; gap:11px; }
        .logo-icon { width:34px; height:34px; background:#FFB703; border-radius:9px; display:flex; align-items:center; justify-content:center; }
        .btn-ghost { padding:9px 18px; border:1px solid rgba(255,255,255,0.14); color:#bbb; border-radius:11px; font-size:13px; font-weight:600; transition:all .2s; display:inline-flex; align-items:center; gap:7px; }
        .btn-ghost:hover { border-color:#FFB703; color:#FFB703; }
        .wrap { max-width:1140px; margin:0 auto; padding:38px 30px 64px; flex:1 0 auto; width:100%; position:relative; z-index:1; }
        .sec-label { color:#FFB703; font-size:13px; font-weight:700; letter-spacing:3px; text-transform:uppercase; display:block; margin-bottom:3px; }
        .alert { border-radius:14px; padding:14px 18px; font-size:13.5px; line-height:1.6; margin-bottom:18px; }
        .alert-success { background:rgba(45,198,83,0.1); border:1px solid rgba(45,198,83,0.3); color:#8ee6a8; }
        .alert-danger  { background:rgba(230,57,70,0.1);  border:1px solid rgba(230,57,70,0.3);  color:#fca5a5; }
        .empty-state { background:#1b1b1b; border:2px dashed rgba(255,255,255,0.1); border-radius:20px; padding:64px 24px; text-align:center; }

        .tbl { width:100%; border-collapse:separate; border-spacing:0 10px; }
        .tbl th { text-align:left; color:#777; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:0 16px; }
        .row-card td { background:#1b1b1b; padding:14px 16px; vertical-align:middle; border-top:1px solid rgba(255,255,255,0.06); border-bottom:1px solid rgba(255,255,255,0.06); }
        .row-card td:first-child { border-left:1px solid rgba(255,255,255,0.06); border-radius:14px 0 0 14px; }
        .row-card td:last-child  { border-right:1px solid rgba(255,255,255,0.06); border-radius:0 14px 14px 0; }

        .btn-approve { background:#2DC653; color:#050e08; font-weight:700; padding:8px 16px; border-radius:9px; border:none; font-size:12.5px; cursor:pointer; transition:background .2s; }
        .btn-approve:hover { background:#26b347; }
        .btn-reject  { background:transparent; color:#fca5a5; font-weight:700; padding:8px 14px; border-radius:9px; border:1px solid rgba(230,57,70,0.4); font-size:12.5px; cursor:pointer; transition:all .2s; }
        .btn-reject:hover { background:rgba(230,57,70,0.12); border-color:#E63946; }
        .reason-input { background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.1); border-radius:9px; padding:8px 11px; color:white; font-size:12px; font-family:inherit; outline:none; width:140px; transition:border-color .2s; }
        .reason-input:focus { border-color:#FFB703; }
        .reason-input::placeholder { color:#555; }

        footer { background:#0f0f0f; border-top:1px solid rgba(255,183,3,0.1); padding:24px 30px; position:relative; z-index:1; }
        .foot-inner { max-width:1140px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    </style>
</head>
<body>

<nav class="v-nav">
    <div class="v-nav-inner">
        <a th:href="@{/superadmin}" class="logo">
            <div class="logo-icon"><span class="fd" style="color:#111; font-size:14px; font-weight:900;">EC</span></div>
            <span class="fd" style="color:white; font-size:22px; font-weight:900; letter-spacing:2px; text-transform:uppercase;">E-Canteen <span style="color:#FFB703;">Admin</span></span>
        </a>
        <a th:href="@{/superadmin}" class="btn-ghost">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            Dashboard
        </a>
    </div>
</nav>

<div class="wrap">
    <span class="sec-label">Vendor Management</span>
    <h1 class="fd" style="font-size:clamp(30px,4vw,46px); font-weight:900; text-transform:uppercase; color:white; line-height:1; margin-bottom:24px;">
        Vendor <span style="color:#FFB703;">Approvals</span>
    </h1>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>

    <div th:if="${applications.isEmpty()}" class="empty-state">
        <div style="width:56px; height:56px; background:rgba(255,183,3,0.1); border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;">
            <svg width="26" height="26" fill="none" stroke="#FFB703" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <p class="fd" style="font-size:20px; font-weight:900; text-transform:uppercase; color:white; margin-bottom:6px;">All Clear</p>
        <p style="color:#666; font-size:13.5px;">No pending vendor applications right now.</p>
    </div>

    <div th:if="${!applications.isEmpty()}" style="overflow-x:auto;">
        <table class="tbl">
            <thead>
            <tr><th>#</th><th>Stall Name</th><th>Description</th><th>Owner</th><th>Phone</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="app : ${applications}" class="row-card">
                <td><span class="fd" style="color:#777; font-size:16px; font-weight:900;">#<span th:text="${app.id}">0</span></span></td>
                <td><span class="fd" style="font-size:18px; font-weight:900; color:white; text-transform:uppercase;" th:text="${app.stallName}">Stall</span></td>
                <td style="color:#aaa; font-size:13px; max-width:200px;" th:text="${app.stallDescription}">desc</td>
                <td style="color:#ccc; font-weight:600;" th:text="${app.ownerName}">owner</td>
                <td style="color:#888; font-size:13px;" th:text="${app.phone}">-</td>
                <td>
                    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                        <form method="post" th:action="@{/superadmin/vendors/approve}">
                            <input type="hidden" name="id" th:value="${app.id}">
                            <button class="btn-approve">Approve</button>
                        </form>
                        <form method="post" th:action="@{/superadmin/vendors/reject}" style="display:flex; gap:6px; align-items:center;">
                            <input type="hidden" name="id" th:value="${app.id}">
                            <input name="reason" class="reason-input" placeholder="Reason (optional)">
                            <button class="btn-reject">Reject</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer>
    <div class="foot-inner">
        <div style="display:flex; align-items:center; gap:9px;">
            <div style="width:26px; height:26px; background:#FFB703; border-radius:7px; display:flex; align-items:center; justify-content:center;"><span class="fd" style="color:#111; font-size:11px; font-weight:900;">EC</span></div>
            <span class="fd" style="color:white; font-size:17px; font-weight:900; letter-spacing:2px; text-transform:uppercase;">E-Canteen</span>
        </div>
        <p style="color:#555; font-size:12px;">&copy; 2026 E-Canteen — Campus Digital Canteen System</p>
    </div>
</footer>
</body>
</html>
